spring:
  # 排除 knife4j 自动装配：knife4j 4.5.0 与 Spring 6.2 (Spring Boot 3.5) + springdoc 2.8.6 ABI 不兼容
  # （Knife4jOpenApiCustomizer 调用旧 List API，新版本换为 Set；以及 Spring 6.2 移除了 ControllerAdviceBean(Object) 构造器）。
  # 排除后 springdoc 自身的 OpenAPI Bean 与 knife4j-openapi3-ui 静态资源仍生效，/doc.html 与 /swagger-ui.html 仍可访问。
  # 当 platform-boot-starter 升级到兼容 Spring 6.2 的 knife4j 版本（4.6+）时可移除此行。
  autoconfigure:
    exclude:
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.address}:3306/easyadmin?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=GMT%2B8
    username: ${mysql.username}
    password: ${mysql.password}
    hikari:
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      pool-name: MyHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${redis.address}
      port: 6379
      database: 12
      #password: ${redis.password}
      client-type: lettuce
      lettuce:
        pool:
          # 最大活跃链接数 默认8
          max-active: 8
          # 最大空闲连接数 默认8
          max-idle: 8
          # 最小空闲连接数 默认0
          min-idle: 0

#==============================knife4j配置=======================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'admin'
      paths-to-match: '/**'
      packages-to-scan: com.aurora.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  basic:
    enable: true
    # Basic认证用户名
    username: root
    # Basic认证密码
    password: 123456
  setting:
    language: zh_cn


