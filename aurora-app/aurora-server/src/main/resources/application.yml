server:
  port: 8800
spring:
  application:
    name: aurora-admin
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

#==============================mybatis-plus配置=========================
mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  typeAliasesPackage: com.aurora.entity

# platform-boot-starter 配置
platform:
  # Quartz 定时任务
  quartz:
    auto-init-table: true
  # Sa-Token 认证
  security:
    enabled: true
    token-name: Authorization
    timeout: 259200
    token-style: uuid
    is-log: true
    exclude-paths:
      - /auth/login
      - /auth/logout
      - /auth/info
      - /auth/verify
