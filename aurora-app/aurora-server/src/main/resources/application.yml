server:
  port: 8800
spring:
  application:
    name: aurora-admin
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

#==============================mybatis-plus配置=========================
mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  typeAliasesPackage: com.aurora.entity
  global-config:
    db-config:
      id-type: AUTO
      field-strategy: not_empty
      column-underline: true
      db-type: mysql
    refresh: true
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# platform-boot-starter 配置
platform:
  # Quartz 定时任务
  quartz:
    auto-init-table: true
  # Sa-Token 认证
  security:
    enabled: true
    token-name: Authorization
    timeout: 259200
    token-style: uuid
    is-log: true
    exclude-paths:
      - /auth/login
      - /auth/logout
      - /auth/info
      - /auth/verify
      - /localFile/**
      - /bizFlow/test
