server:
  # 服务端口
  port: 8800

spring:
  profiles:
    # 激活环境
    active: dev
  application:
    name: Nexora-Admin
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 50MB
      # 请求体包含 multipart 边界，需略高于单文件上限。
      max-request-size: 51MB
  config:
    import:
      - classpath:config/mybatis-plus.yml
      - classpath:config/platform.yml
      - classpath:config/swagger.yml
