mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  typeAliasesPackage: com.nexora.identity.entity,com.nexora.file.entity,com.nexora.mail.entity,com.nexora.monitor.entity,com.nexora.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl

  # ============== 3. 全局策略配置 ==============
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      table-underline: true

platform:
  mybatis-plus:
    # 动态表名（按月分表场景，关闭则不启用）
    dynamic-table:
      enable: false
      # 需要动态表名的表名列表
      tables:
        - sys_operate_log
      # 线程未指定后缀时是否回退到当前月份（yyyyMM）
      fallback-to-current-month: false
