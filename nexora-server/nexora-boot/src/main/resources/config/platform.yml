# platform-boot-starter 配置（业务功能，与环境无关）
# 包含：Quartz 定时任务、Sa-Token 认证
platform:
  redis:
    two-level-cache:
      enabled: true
      instances:
        - name: sysConfig
          max-size: 1000
          default-ttl: 5m
  # Quartz 定时任务
  quartz:
    auto-init-table: true
  # Sa-Token 认证
  security:
    enabled: true
    token-name: Authorization
    timeout: 259200
    token-style: uuid
    is-log: true
    exclude-paths:
      - /auth/login
