# platform-boot-starter 配置（业务功能，与环境无关）
# 包含：Quartz 定时任务、Sa-Token 认证
platform:
  verification:
    key-prefix: nexora:verification
    mail:
      enabled: ${MAIL_VERIFICATION_ENABLED:false}
      from: ${SMTP_FROM:${SMTP_USERNAME:}}
      from-name: ${SMTP_FROM_NAME:Nexora Admin}
      code-length: 6
      expire-time: 5m
      cooldown: 60s
    image:
      enabled: true
      type: SLIDER
  redis:
    two-level-cache:
      enabled: true
      instances:
        - name: sysConfig
          max-size: 1000
          default-ttl: 5m
  # Quartz 定时任务
  quartz:
    auto-init-table: true
  # Sa-Token 认证
  security:
    enabled: true
    token-name: Authorization
    timeout: 259200
    token-style: uuid
    is-log: true
    exclude-paths:
      - /auth/login
      - /auth/register/sendCode
      - /auth/register
      - /auth/image
      - /auth/image/*/match
      - /auth/password/reset/sendCode
      - /auth/password/reset
      - /sys/config/value/**
