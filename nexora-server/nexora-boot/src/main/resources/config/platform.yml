# platform-boot-starter 配置（业务功能，与环境无关）
# 包含：WebMVC、验证码、Redis、OSS 文件校验、Quartz 定时任务、Sa-Token 认证
platform:
  webmvc:
    # 响应报文加密目前未使用；标注 @EncryptResponse 的接口使用时才校验。
    response-secret-key: ${PLATFORM_RESPONSE_SECRET_KEY:}
    # Base64 编码的 32 字节服务端凭据密钥；邮件授权码、微信登录敏感配置和 SSH 密码统一使用。
    credential-secret-key: ${PLATFORM_CREDENTIAL_SECRET_KEY:}
  mybatis-plus:
    # 动态表名（按月分表场景，关闭则不启用）
    dynamic-table:
      enable: false
      # 需要动态表名的表名列表
      tables:
        - sys_operate_log
      # 线程未指定后缀时是否回退到当前月份（yyyyMM）
      fallback-to-current-month: false
  verification:
    key-prefix: nexora:verification
    mail:
      # 验证码基础设施固定启用，实际发送由数据库 email.enabled 控制
      enabled: true
      code-length: 6
      expire-time: 5m
      cooldown: 60s
    image:
      enabled: true
      type: SLIDER
  redis:
    two-level-cache:
      enabled: true
      instances:
        - name: sysConfigGroup
          max-size: 1000
          default-ttl: 3d
  oss:
    upload-validation:
      max-size: 50MB
      max-filename-length: 255
  # Quartz 定时任务
  quartz:
    auto-init-table: true
  # Sa-Token 认证
  security:
    enabled: true
    token-name: Authorization
    timeout: 259200
    token-style: uuid
    is-log: true
    exclude-paths:
      - /auth/login
      - /auth/wechat/transaction
      - /auth/wechat/poll
      - /auth/wechat/cancel
      - /auth/wechat/portal
      - /auth/register/sendCode
      - /auth/register
      - /auth/image
      - /auth/image/*/match
      - /auth/password/reset/sendCode
      - /auth/password/reset
      - /sys/config-group/public
      # SSH WebSocket 使用 30 秒一次性票据完成独立认证。
      - /ws/ssh
