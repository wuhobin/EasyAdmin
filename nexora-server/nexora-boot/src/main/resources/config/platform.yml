# platform-boot-starter 配置（业务功能，与环境无关）
# 包含：Quartz 定时任务、Sa-Token 认证
platform:
  verification:
    key-prefix: nexora:verification
    mail:
      # 验证码基础设施固定启用，实际发送由数据库 email.enabled 控制
      enabled: true
      code-length: 6
      expire-time: 5m
      cooldown: 60s
    image:
      enabled: true
      type: SLIDER
  redis:
    two-level-cache:
      enabled: true
      instances:
        - name: sysConfigGroup
          max-size: 1000
          default-ttl: 3d
  # Quartz 定时任务
  quartz:
    auto-init-table: true
  # Sa-Token 认证
  security:
    enabled: true
    token-name: Authorization
    timeout: 259200
    token-style: uuid
    is-log: true
    exclude-paths:
      - /auth/login
      - /auth/register/sendCode
      - /auth/register
      - /auth/image
      - /auth/image/*/match
      - /auth/password/reset/sendCode
      - /auth/password/reset
      - /sys/config-group/public
      # SSH WebSocket 使用 30 秒一次性票据完成独立认证。
      - /ws/ssh
