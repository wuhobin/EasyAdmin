# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '身份权限'
      paths-to-match: '/**'
      packages-to-scan: com.nexora.identity.controller
    - group: '系统管理'
      paths-to-match: '/**'
      packages-to-scan: com.nexora.system.controller
    - group: '监控管理'
      paths-to-match: '/**'
      packages-to-scan: com.nexora.monitor.controller
    - group: '文件管理'
      paths-to-match: '/**'
      packages-to-scan: com.nexora.file.controller
    - group: '邮件管理'
      paths-to-match: '/**'
      packages-to-scan: com.nexora.mail.controller

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: WuHongBin - Copyright 2026 [wuhobin.TOP](https://wuhobin.top) | 鸣谢 [knife4j](https://gitee.com/xiaoym/knife4j)
