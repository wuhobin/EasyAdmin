server {
    #SSL 默认访问端口号为 443
    listen 443 ssl http2;
    #请填写绑定证书的域名
    server_name easyadmin.wuhobin.top;
    #请填写证书文件的相对路径或绝对路径
    ssl_certificate ./ssl/easyadmin.wuhobin.top/easyadmin.wuhobin.top_bundle.crt;
    #请填写私钥文件的相对路径或绝对路径
    ssl_certificate_key ./ssl/easyadmin.wuhobin.top/easyadmin.wuhobin.top.key;
    ssl_session_timeout 5m;
    #请按照以下协议配置
    ssl_protocols TLSv1.2 TLSv1.3;
    #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 上传文件大小限制
    client_max_body_size 50m;

     # 日志
    access_log /var/log/nginx/nexora-admin-access.log;
    error_log /var/log/nginx/nexora-admin-error.log warn;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

     # 前端构建文件目录
    root /opt/nexora-admin/web;
    index index.html;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket：通知中心、SSH 终端
    location ^~ /api/ws/ {
    proxy_pass http://127.0.0.1:8800/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;
    }



    # ============ 所有 API 代理到后端 ============
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8800/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Vite 带哈希的静态资源
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # 首页每次重新验证，避免更新后继续使用旧页面
    location = /index.html {
        expires -1;
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }



}

server {
    listen 80;
    server_name easyadmin.wuhobin.top;
    access_log off;
    return 301 https://$host$request_uri;
}